name: Scrape Jail Roster

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two scrapes run at once — both would push and one would fail,
# or worse, a release could be recorded twice.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    # The first run fetches details for everyone (~300 small pages, ~3 min);
    # later runs ~1 min. Cap it so a hung request can't burn hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A failed install or scrape doesn't end the run here. The health step
      # below decides whether it's been broken long enough to fail (and email).
      - name: Install backend deps
        id: install
        continue-on-error: true
        run: npm install

      - name: Run scraper
        id: scrape
        continue-on-error: true
        timeout-minutes: 15
        run: node scrape.js

      - name: Record scraper health
        id: health
        run: |
          if [ "${{ steps.install.outcome }}" = success ] && [ "${{ steps.scrape.outcome }}" = success ]; then
            bash .github/scripts/scrape-health.sh success
          else
            # Keep the last good data, not whatever a failed run half-wrote.
            git checkout -- data/ 2>/dev/null || true
            git clean -fdq data/ 2>/dev/null || true
            bash .github/scripts/scrape-health.sh failure
          fi

      # Committing, building and publishing never fail the run: a hiccup here
      # leaves the data in place and the next run tries again.
      - name: Commit updated data files
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/change_log.json data/stats.json data/status.json .github/scrape-health.json
          git diff --cached --quiet || git commit -m "chore: scrape $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 0 1 2 3; do
            if [ "$attempt" -gt 0 ]; then
              echo "Push rejected -- retry $attempt of 3 after pulling the newer commit"
              sleep $((attempt * 5))
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push; then exit 0; fi
          done
          echo "::warning::Push still rejected after 3 retries; the next run will push this data"

      - name: Copy data files into frontend public
        run: |
          mkdir -p frontend/public/data
          cp data/change_log.json data/stats.json data/status.json frontend/public/data/

      - name: Build frontend
        id: build
        continue-on-error: true
        run: cd frontend && npm install && npm run build

      - name: Deploy to GitHub Pages
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true

      - name: Fail if the scraper has been broken for 24 hours
        if: steps.health.outputs.fail == 'true'
        run: exit 1
