name: Scrape Jail Roster

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two scrapes run at once — both would push and one would fail,
# or worse, a release could be recorded twice.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    # The first run fetches details for everyone (~300 small pages, ~3 min);
    # later runs ~1 min. Cap it so a hung request can't burn hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        run: npm install

      - name: Run scraper
        run: node scrape.js

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/change_log.json data/stats.json data/status.json
          git diff --cached --quiet || git commit -m "chore: scrape $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Copy data files into frontend public
        run: |
          mkdir -p frontend/public/data
          cp data/change_log.json data/stats.json data/status.json frontend/public/data/

      - name: Build frontend
        run: cd frontend && npm install && npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true
