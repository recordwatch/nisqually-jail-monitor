name: Probe Nisqually roster

# One-off test: can GitHub's servers reach the Nisqually jail system (plain
# http on port 81), and what do its pages look like? Saves what it downloads
# to the `probe` branch. Replaced by the real scraper once we know.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download custody list, releases and detail pages
        run: |
          # Probe, not a build: a search that finds nothing is information,
          # not a reason to stop. Keep going and save whatever we got.
          set +e
          mkdir -p out && cd out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:140.0) Gecko/20100101 Firefox/140.0'
          BASE='http://nit-pscapp.nisqually-nsn.gov:81'
          get() { # name url
            curl -sS -L --max-time 60 -A "$UA" -e "$BASE/Home/BookingSearchQuery" \
              -D "$1.headers" -o "$1.html" -w "$1 %{http_code} %{size_download}B %{time_total}s %{url_effective}\n" "$2" >> status.txt 2>> error.txt || echo "$1 FAILED" >> status.txt
            sleep 1
          }
          getent hosts nit-pscapp.nisqually-nsn.gov > dns.txt 2>&1 || echo "DNS lookup failed" > dns.txt
          rows() { grep -c 'BookingNumber=' "$1.html"; }  # one View link per result row
          get query "$BASE/Home/BookingSearchQuery"
          # Every in-custody page until an empty one, to get the true count.
          Q='LastName=%25&FirstName=&BookingFrom=&BookingTo=&ReleaseFrom=&ReleaseTo=&Status=IN+CUSTODY&ValidSearch=&sort=BookingDate&sortdir=DESC'
          for p in 1 2 3 4 5 6 7 8 9; do
            get "custody$p" "$BASE/Home/BookingSearchResult?$Q&page=$p"
            n=$(rows "custody$p"); echo "custody$p rows=$n" >> status.txt
            [ "$n" -eq 0 ] && break
          done
          # Release-search variants: which (if any) lists released people?
          Y=$(TZ=America/Los_Angeles date -d yesterday +%m/%d/%Y | sed 's#/#%2F#g')
          Y1=$(TZ=America/Los_Angeles date -d yesterday +%-m/%-d/%Y | sed 's#/#%2F#g')
          YI=$(TZ=America/Los_Angeles date -d yesterday +%Y-%m-%d)
          B='LastName=%25&FirstName=&ValidSearch=&sort=BookingDate&sortdir=DESC&page=1'
          get rel_nodate   "$BASE/Home/BookingSearchResult?$B&BookingFrom=&BookingTo=&ReleaseFrom=&ReleaseTo=&Status=OUT+OF+CUSTODY"
          get rel_mmdd     "$BASE/Home/BookingSearchResult?$B&BookingFrom=&BookingTo=&ReleaseFrom=$Y&ReleaseTo=&Status=OUT+OF+CUSTODY"
          get rel_md       "$BASE/Home/BookingSearchResult?$B&BookingFrom=&BookingTo=&ReleaseFrom=$Y1&ReleaseTo=&Status=OUT+OF+CUSTODY"
          get rel_iso      "$BASE/Home/BookingSearchResult?$B&BookingFrom=&BookingTo=&ReleaseFrom=$YI&ReleaseTo=&Status=OUT+OF+CUSTODY"
          get all_recent   "$BASE/Home/BookingSearchResult?$B&BookingFrom=$Y&BookingTo=&ReleaseFrom=&ReleaseTo=&Status=ALL"
          for f in rel_nodate rel_mmdd rel_md rel_iso all_recent; do echo "$f rows=$(rows $f)" >> status.txt; done
          # Detail pages for booking numbers just below the newest ones; some
          # of these people are likely released already.
          for b in 26007140 26007141 26007142 26007143 26007144 26007145 26007146 26007147 26007148; do
            get "detail_$b" "$BASE/Home/BookingSearchDetail?BookingNumber=$b"
            grep -oE '(IN CUSTODY|RELEASED|OUT OF CUSTODY)[^<]{0,30}' "detail_$b.html" | head -1 | sed "s/^/detail_$b status: /" >> status.txt
          done
          cat dns.txt status.txt error.txt; ls -la

      - name: Save results to the probe branch
        if: always()
        run: |
          cd out
          git init -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "probe $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe
