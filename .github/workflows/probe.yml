name: Probe Nisqually roster

# One-off test: can GitHub's servers reach the Nisqually jail system (plain
# http on port 81), and what do its pages look like? Saves what it downloads
# to the `probe` branch. Replaced by the real scraper once we know.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download custody list, releases and detail pages
        run: |
          mkdir -p out && cd out
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:140.0) Gecko/20100101 Firefox/140.0'
          BASE='http://nit-pscapp.nisqually-nsn.gov:81'
          get() { # name url
            curl -sS -L --max-time 60 -A "$UA" -e "$BASE/Home/BookingSearchQuery" \
              -D "$1.headers" -o "$1.html" -w "$1 %{http_code} %{size_download}B %{time_total}s %{url_effective}\n" "$2" >> status.txt 2>> error.txt || echo "$1 FAILED" >> status.txt
            sleep 1
          }
          getent hosts nit-pscapp.nisqually-nsn.gov > dns.txt 2>&1 || echo "DNS lookup failed" > dns.txt
          get query "$BASE/Home/BookingSearchQuery"
          # In-custody list (the default Status). Page until a short page so
          # we learn the page size and total count.
          Q='LastName=%25&FirstName=&BookingFrom=&BookingTo=&ReleaseFrom=&ReleaseTo=&Status=IN+CUSTODY&ValidSearch=&sort=BookingDate&sortdir=DESC'
          for p in 1 2 3 4 5 6 7 8; do
            get "custody$p" "$BASE/Home/BookingSearchResult?$Q&page=$p"
            rows=$(grep -o '<tr>' "custody$p.html" | wc -l)
            echo "custody$p rows(tr)=$rows" >> status.txt
            [ "$rows" -lt 40 ] && break
          done
          # Releases since yesterday, via the Status dropdown.
          FROM=$(TZ=America/Los_Angeles date -d yesterday +%m/%d/%Y)
          R="LastName=%25&FirstName=&BookingFrom=&BookingTo=&ReleaseFrom=$(printf %s "$FROM" | sed 's#/#%2F#g')&ReleaseTo=&Status=OUT+OF+CUSTODY&ValidSearch=&sort=BookingDate&sortdir=DESC"
          get released1 "$BASE/Home/BookingSearchResult?$R&page=1"
          # Detail pages: two in custody, one released (by booking number,
          # the way the Kitsap scraper builds them).
          b1=$(grep -oE '<td>[0-9]{6,}</td>' custody1.html | sed -n 2p | grep -oE '[0-9]+')
          b2=$(grep -oE '<td>[0-9]{6,}</td>' custody1.html | sed -n 5p | grep -oE '[0-9]+')
          b3=$(grep -oE '<td>[0-9]{6,}</td>' released1.html | sed -n 1p | grep -oE '[0-9]+')
          echo "detail booking numbers: $b1 $b2 $b3" >> status.txt
          [ -n "$b1" ] && get detail1 "$BASE/Home/BookingSearchDetail?BookingNumber=$b1"
          [ -n "$b2" ] && get detail2 "$BASE/Home/BookingSearchDetail?BookingNumber=$b2"
          [ -n "$b3" ] && get detail_released "$BASE/Home/BookingSearchDetail?BookingNumber=$b3"
          cat dns.txt status.txt error.txt; ls -la

      - name: Save results to the probe branch
        run: |
          cd out
          git init -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "probe $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe
